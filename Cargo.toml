[package]
name = "macbar"
version = "0.2.0"
edition = "2024"
description = "Native macOS-style menu bar for Windows 11 with Dynamic Island, Control Center, weather and media controls (Rust + Direct2D)"
license = "MIT"
repository = "https://github.com/PelayoNaredo/macbar"
readme = "README.md"
keywords = ["windows", "menu-bar", "macos", "direct2d", "dynamic-island"]
categories = ["gui"]

[dependencies]
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_UI_Controls", "Win32_System_WinRT", "Media_Control", "Foundation", "Foundation_Collections", "Foundation_Numerics", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Storage_Streams", "Devices_Geolocation", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Shutdown", "Win32_System_Wmi", "Win32_System_Ole", "Devices_Radios", "Win32_NetworkManagement_WiFi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Networking_NetworkListManager", "Win32_System_DataExchange", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition", "Win32_System_Diagnostics_Debug", "Win32_Devices", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Memory", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Devices_Enumeration", "Devices_Bluetooth", "Win32_UI_Shell_Common"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
